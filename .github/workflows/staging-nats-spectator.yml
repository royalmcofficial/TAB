name: TAB NATS spectator staging build

on:
  push:
    branches:
      - fix/nats-globalplayerlist-spectator-2026-11
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Build TAB plugin JAR
        run: |
          chmod +x gradlew
          ./gradlew :velocity:shadowJar --no-daemon --no-configuration-cache --stacktrace
      - name: Upload staging TAB JAR
        uses: actions/upload-artifact@v4
        with:
          name: RoyalMC-TAB-NATS-spectator-fix-staging
          path: velocity/build/libs/TAB-velocity-*.jar
          if-no-files-found: error
          retention-days: 14
