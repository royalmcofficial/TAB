name: TAB NATS spectator staging build

on:
  push:
    branches:
      - fix/nats-globalplayerlist-spectator-2026-11
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Build TAB plugin JAR
        run: |
          chmod +x gradlew
          ./gradlew :velocity:shadowJar --no-daemon --no-configuration-cache --stacktrace
      - name: Verify NATS classes and configuration are packaged
        run: |
          set -euo pipefail
          shopt -s nullglob
          jars=(velocity/build/libs/TAB-velocity-*.jar)
          test "${#jars[@]}" -eq 1
          jar="${jars[0]}"
          echo "Verifying $jar"
          for class in \
            me/neznamy/tab/shared/features/proxy/NatsProxySupport.class \
            me/neznamy/tab/libs/io/nats/client/Nats.class \
            me/neznamy/tab/shared/features/proxy/ProxySupportConfiguration.class \
            me/neznamy/tab/shared/features/globalplayerlist/GlobalPlayerList.class; do
            unzip -Z1 "$jar" | grep -Fxq "$class"
          done
          unzip -p "$jar" config/config.yml | grep -q 'Supported types: PLUGIN, REDIS, RABBITMQ, NATS'
          unzip -p "$jar" config/config.yml | grep -q 'credentials-file'
          unzip -p "$jar" velocity-plugin.json | grep -q '"id":"tab"'
          ls -lh "$jar"
      - name: Upload staging TAB JAR
        uses: actions/upload-artifact@v4
        with:
          name: RoyalMC-TAB-NATS-spectator-fix-staging
          path: velocity/build/libs/TAB-velocity-*.jar
          if-no-files-found: error
          retention-days: 14
